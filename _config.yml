# Configuración mínima para redirección a csalcedodatabi.com
# Este sitio ahora solo sirve como punto de redirección

# Desactivar tema Jekyll para usar páginas HTML estáticas
# theme: jekyll-theme-chirpy

# Configuración básica
title: CSalcedoDataBI - Redirigiendo
description: Este sitio se ha mudado a csalcedodatabi.com
url: "https://CSalcedoDataBI.github.io"
baseurl: ""

# Desactivar plugins innecesarios
plugins: []

# No procesar posts ni colecciones
collections: {}

# Excluir todo excepto archivos de redirección
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - rollup.config.js
  - package*.json
  - _posts
  - _drafts
  - _tabs
  - _javascript
  - _plugins
  - Example
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Incluir solo los archivos necesarios
include:
  - index.html
  - 404.html
