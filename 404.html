<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Redirección automática -->
    <meta http-equiv="refresh" content="0; url=https://csalcedodatabi.com/">
    <link rel="canonical" href="https://csalcedodatabi.com/">

    <title>Página no encontrada - Redirigiendo...</title>

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-align: center;
      }
      .container {
        padding: 2rem;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
      h2 {
        font-size: 1.2rem;
        font-weight: normal;
        margin-bottom: 1rem;
        opacity: 0.9;
      }
      p {
        opacity: 0.9;
      }
      a {
        color: white;
        text-decoration: underline;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner"></div>
      <h1>404</h1>
      <h2>Esta página ya no existe aquí</h2>
      <p>Mi sitio web se ha mudado a:</p>
      <p><a href="https://csalcedodatabi.com/">csalcedodatabi.com</a></p>
      <p><small>Serás redirigido automáticamente en unos segundos.</small></p>
    </div>

    <script>
      // Redirección JavaScript como respaldo
      window.location.replace('https://csalcedodatabi.com/');
    </script>
  </body>
</html>
